included:
  - .

excluded:
  - Pods
  - Carthage
  - .build
  - DerivedData
  - Generated
  - .git
  - "**/*.xcodeproj"
  - Build
  - "**/Build"

# 사고 예방 규칙 (모두 에러 처리)
force_unwrapping: error               # 강제 언래핑 금지
force_cast: error                     # 강제 캐스팅 금지
force_try: error                      # 강제 try 금지
implicitly_unwrapped_optional: error  # 암시적 옵셔널 금지
duplicate_imports: error              # 중복 import 금지
unused_import: error                  # 사용하지 않는 import 금지
